{% load static %}

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Computer Laboratory Equipment Inventory System{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'equipment/style.css' %}">
</head>

<body>

    <div class="sidebar">

        <div class="sidebar-title">

            <svg class="computer-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="13" rx="1.5"></rect>
                <path d="M8 21h8"></path>
                <path d="M12 17v4"></path>
            </svg>

            <div>
                <h2>Computer Lab</h2>
                <h3>Equipment Inventory</h3>
            </div>

        </div>

        <nav class="sidebar-menu">

            <a href="{% url 'index' %}">

                <svg class="menu-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5"></path>
                    <path d="M5 9.5V21h14V9.5"></path>
                    <path d="M9 21v-6h6v6"></path>
                </svg>

                <span>Home</span>

            </a>

            <a href="{% url 'equipment_list' %}">

                <svg class="menu-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                    <path d="M7 8h10"></path>
                    <path d="M7 12h10"></path>
                    <path d="M7 16h6"></path>
                </svg>

                <span>Equipment</span>

            </a>

            <a href="{% url 'equipment_create' %}">

                <svg class="menu-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 8v8"></path>
                    <path d="M8 12h8"></path>
                </svg>

                <span>Add Equipment</span>

            </a>

        </nav>

    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
